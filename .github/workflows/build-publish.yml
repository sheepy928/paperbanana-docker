name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: "Override upstream PaperBanana commit (full SHA). Leave empty to use VERSION file."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          UPSTREAM_SHORT="${VERSION%%-*}"
          ITERATION="${VERSION##*-}"
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UPSTREAM_SHORT}" >> "$GITHUB_OUTPUT"
          echo "iteration=${ITERATION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (upstream: ${UPSTREAM_SHORT}, iteration: ${ITERATION})"

      - name: Resolve upstream commit
        id: upstream
        run: |
          OVERRIDE="${{ github.event.inputs.upstream_commit }}"
          if [ -n "${OVERRIDE}" ]; then
            echo "commit=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "Using workflow_dispatch override: ${OVERRIDE}"
          else
            SHORT="${{ steps.version.outputs.upstream_short }}"
            FULL=$(git ls-remote https://github.com/dwzhu-pku/PaperBanana.git | \
                   grep -E "^${SHORT}" | head -1 | awk '{print $1}')
            if [ -z "${FULL}" ]; then
              echo "::error::Could not resolve short hash '${SHORT}' to a full commit"
              exit 1
            fi
            echo "commit=${FULL}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${SHORT} → ${FULL}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-
          labels: |
            org.opencontainers.image.title=PaperBanana Docker
            org.opencontainers.image.description=Production container for PaperBanana — automated academic illustration
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.commit }}
            org.opencontainers.image.source=https://github.com/dwzhu-pku/PaperBanana
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UPSTREAM_COMMIT=${{ steps.upstream.outputs.commit }}
            IMAGE_VERSION=${{ steps.version.outputs.full }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: |
          echo "### Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.version.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Upstream commit**: \`${{ steps.upstream.outputs.commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
